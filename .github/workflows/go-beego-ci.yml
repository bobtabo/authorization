name: Go Beego CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/go-beego/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: 'docker#DOCKER1234'
          MYSQL_DATABASE: 'authorization'
          MYSQL_USER: 'develop'
          MYSQL_PASSWORD: 'docker#DOCKER1234'
        options: --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: go mod download
        working-directory: backends/go-beego

      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -u root -p'docker#DOCKER1234' -e "
            CREATE DATABASE IF NOT EXISTS authorization_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON authorization_test.* TO 'develop'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run tests
        run: go test ./tests/...
        working-directory: backends/go-beego
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: authorization_test
          DB_USERNAME: develop
          DB_PASSWORD: "docker#DOCKER1234"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CACHE_PREFIX: ""
          JWT_ISSUER: authorization
          JWT_TTL: "1800"
          GATE_JWT_CACHE_TTL: "1800"
          APP_FRONTEND_URL: "http://localhost:5173"
