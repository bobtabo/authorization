# Rust CI ワークフロー
# developブランチのbackends/rust-axum/**変更時にCIを実行
name: Rust CI

on:
  push:
    branches-ignore:
      - 'feature/issue-*'
    paths:
      - 'backends/rust-axum/**'
  workflow_dispatch:

jobs:
  test:
    # Ubuntu ランナーを使用
    runs-on: ubuntu-latest

    # サービスコンテナ: MySQLとRedisをテスト用に起動
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: 'docker#DOCKER1234'
          MYSQL_DATABASE: 'authorization'
          MYSQL_USER: 'develop'
          MYSQL_PASSWORD: 'docker#DOCKER1234'
        options: --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    # CI実行ステップ
    steps:
      - uses: actions/checkout@v4

      # Rust stable をセットアップ
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo キャッシュ
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/rust-axum/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backends/rust-axum/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # テスト用DBを作成
      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -u root -p'docker#DOCKER1234' -e "
            CREATE DATABASE IF NOT EXISTS authorization_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON authorization_test.* TO 'develop'@'%';
            FLUSH PRIVILEGES;
          "

      # ビルドを実行
      - name: Build
        run: cargo build
        working-directory: backends/rust-axum

      # ユニットテストを実行
      - name: Run unit tests
        run: cargo test --lib
        working-directory: backends/rust-axum
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: authorization_test
          DB_USERNAME: develop
          DB_PASSWORD: "docker#DOCKER1234"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          APP_ENV: testing
          CACHE_PREFIX: ""
          GATE_JWT_CACHE_TTL: "1800"
          FRONTEND_URL: "http://localhost:3000"

      # インテグレーションテストを実行（DB競合を避けるため単一スレッドで実行）
      - name: Run integration tests
        run: cargo test --test integration -- --test-threads=1
        working-directory: backends/rust-axum
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: authorization_test
          DB_USERNAME: develop
          DB_PASSWORD: "docker#DOCKER1234"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          APP_ENV: testing
          CACHE_PREFIX: ""
          GATE_JWT_CACHE_TTL: "1800"
          FRONTEND_URL: "http://localhost:3000"
