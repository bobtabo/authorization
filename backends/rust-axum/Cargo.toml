[package]
name = "authorization"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "authorization"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0", features = ["mysql", "runtime-tokio-native-tls", "chrono", "macros"] }
redis = { version = "0", features = ["tokio-comp"] }
lettre = { version = "0", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }
chrono = { version = "0", features = ["serde"] }
async-trait = "0"
axum-extra = { version = "0", features = ["cookie"] }
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
time = "0.3"
percent-encoding = "2"
garde = { version = "0.22", features = ["derive", "regex"] }
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# デバッグビルドでも RSA 鍵生成が実用的な速度になるよう暗号系クレートだけ最適化する。
# cargo watch -x run (debug build) は rsa クレートが無最適化だと 4096bit 鍵生成に数十秒かかり
# フロントエンドの 10 秒タイムアウトを超えてしまうため。
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3
[profile.dev.package.rand]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
