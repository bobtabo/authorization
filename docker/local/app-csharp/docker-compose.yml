networks:
  authorization:
    external: true

services:
  nginx:
    container_name: ${NGINX_CONTAINER}
    build: nginx
    ports:
      - '${NGINX_HTTP_PORT}'
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - csharp
    environment:
      - APP_NAME=${APP_NAME}
      - SERVER_NAME=${SERVER_NAME}
      - APP_PATH=${APP_PATH}
      - VIRTUAL_HOST=${SERVER_NAME}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${SERVER_NAME}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_NAME=default
      - HTTPS_METHOD=noredirect
    networks:
      - authorization

  csharp:
    container_name: ${CSHARP_CONTAINER}
    build: csharp
    volumes:
      - ./../../../backends/csharp-aspnet:/var/www/${APP_NAME}
      - csharp_nuget:/home/docker/.nuget
    working_dir: /var/www/${APP_NAME}
    command: dotnet watch --project src/Authorization.Api run --non-interactive
    environment:
      - APP_ENV=local
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    networks:
      - authorization

volumes:
  csharp_nuget:
