networks:
  authorization:
    external: true

services:
  localstack:
    image: localstack/localstack:2.3.2
    container_name: ${LOCALSTACK_CONTAINER}
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=apigateway,lambda,iam,ses,ssm
      - LAMBDA_DOCKER_NETWORK=authorization
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/localstack:/var/lib/localstack
    networks:
      - authorization

  ses-relay:
    image: python:3.11-slim
    container_name: ${SES_RELAY_CONTAINER:-auth-ses-relay}
    command: python3 /relay.py
    volumes:
      - ./ses-relay.py:/relay.py:ro
    depends_on:
      - localstack
      - mailpit
    networks:
      - authorization
    restart: on-failure

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${MAILPIT_CONTAINER}
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    networks:
      - authorization
