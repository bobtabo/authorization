networks:
  authorization:
    external: true

# ============================================================
# emulator モード（非推奨）
# ============================================================
# LocalStack が使えない環境向けのフォールバックです。
# Lambda 常駐起動 + LocalStack (SES のみ) による方式。
# 新規開発では localstack モードを推奨します。
# ============================================================

services:
  localstack:
    image: localstack/localstack
    container_name: ${LOCALSTACK_CONTAINER:-auth-localstack}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=ses
    networks:
      - authorization

  lambda:
    image: public.ecr.aws/lambda/provided:al2023
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c", "cp /var/task/bootstrap /var/runtime/bootstrap && chmod +x /var/runtime/bootstrap && exec /lambda-entrypoint.sh bootstrap"]
    restart: always
    volumes:
      - ../../../function:/var/task
    ports:
      - "${LAMBDA_PORT}:8080"
    environment:
      - INSECURE_SKIP_TLS_VERIFY=true
    networks:
      - authorization
    logging:
      options:
        max-size: "5m"
        max-file: "10"
