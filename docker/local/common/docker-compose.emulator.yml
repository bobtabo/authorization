networks:
  authorization:
    external: true

# ============================================================
# emulator モード（非推奨）
# ============================================================
# LocalStack が使えない環境向けのフォールバックです。
# Lambda 常駐起動 + MailPit による従来方式。
# 新規開発では localstack モードを推奨します。
# ============================================================

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${MAILPIT_CONTAINER}
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    networks:
      - authorization

  lambda:
    image: public.ecr.aws/lambda/provided:al2023
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c", "cp /var/task/bootstrap /var/runtime/bootstrap && chmod +x /var/runtime/bootstrap && exec /lambda-entrypoint.sh bootstrap"]
    restart: always
    volumes:
      - ../../../function:/var/task
    ports:
      - "${LAMBDA_PORT}:8080"
    environment:
      - INSECURE_SKIP_TLS_VERIFY=true
    networks:
      - authorization
    logging:
      options:
        max-size: "5m"
        max-file: "10"
