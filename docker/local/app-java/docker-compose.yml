networks:
  authorization:
    external: true

services:
  nginx:
    container_name: ${NGINX_CONTAINER}
    build: nginx
    ports:
      - '${NGINX_HTTP_PORT}'
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - java
    environment:
      - APP_NAME=${APP_NAME}
      - SERVER_NAME=${SERVER_NAME}
      - APP_PATH=${APP_PATH}
      - VIRTUAL_HOST=${SERVER_NAME}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${SERVER_NAME}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_NAME=default
      - HTTPS_METHOD=noredirect
    networks:
      - authorization

  java:
    container_name: ${JAVA_CONTAINER}
    build: java
    ports:
      - '${JAVA_DEBUG_PORT}:5005'
    volumes:
      - ./../../../backends/java-spring:/var/www/${APP_NAME}
      - java_build:/var/www/${APP_NAME}/build
      - java_gradle:/var/www/${APP_NAME}/.gradle
    working_dir: /var/www/${APP_NAME}
    environment:
      - APP_NAME=${APP_NAME}
    # backends/java-spring が未整備でもコンテナ機構自体を検証できるよう、
    # build.gradle(.kts) が無い間はプロセスを終了させず待機する
    command:
      - sh
      - -c
      - |
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            exec gradle bootRun
          else
            exec tail -f /dev/null
          fi
    networks:
      - authorization

volumes:
  java_build:
  java_gradle:
